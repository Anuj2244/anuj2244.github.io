media:
  input: assets/img
  output: /assets/img

content:
  - name: duyurular
    label: Duyurular ve haberler
    type: collection
    path: _duyurular
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Başlık
        type: string
        required: true
      - name: date
        label: Tarih
        type: date
        required: true
      - name: ozet
        label: Kısa özet
        type: text
      - name: gorsel
        label: Görsel
        type: image
      - name: body
        label: İçerik
        type: rich-text

  - name: cagrilar
    label: Çağrılar
    type: collection
    path: _cagrilar
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, son_tarih, tur]
    fields:
      - name: title
        label: Çağrı adı
        type: string
        required: true
      - name: tur
        label: Program türü
        type: select
        options:
          values: [TÜBİTAK, Uluslararası, Diğer]
      - name: son_tarih
        label: Son başvuru tarihi
        type: date
        required: true
      - name: destek
        label: Destek bilgisi
        type: string
      - name: hedef
        label: Kimler başvurabilir
        type: string
      - name: link
        label: Çağrının resmi sayfası (https:// ile başlayan adres)
        type: string
      - name: date
        label: Eklenme tarihi
        type: date
        required: true
      - name: body
        label: Açıklama
        type: rich-text

  - name: ziyaretler
    label: Firma ziyaretleri
    type: collection
    path: _ziyaretler
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, firma, date]
    fields:
      - name: title
        label: Başlık
        type: string
        required: true
      - name: firma
        label: Firma adı
        type: string
      - name: date
        label: Ziyaret tarihi
        type: date
        required: true
      - name: ozet
        label: Kısa özet
        type: text
      - name: gorsel
        label: Görsel
        type: image
      - name: body
        label: Ziyaret notları
        type: rich-text

  - name: etkinlikler
    label: Etkinlikler
    type: collection
    path: _etkinlikler
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, yer]
    fields:
      - name: title
        label: Etkinlik adı
        type: string
        required: true
      - name: date
        label: Etkinlik tarihi
        type: date
        required: true
      - name: yer
        label: Yer
        type: string
      - name: ozet
        label: Kısa özet
        type: text
      - name: gorsel
        label: Görsel
        type: image
      - name: body
        label: Ayrıntılar
        type: rich-text

  - name: sayfalar
    label: Sayfalar
    type: collection
    path: sayfalar
    filename: "{primary}.md"
    view:
      fields: [title, permalink]
    fields:
      - name: title
        label: Sayfa başlığı
        type: string
        required: true
      - name: permalink
        label: Sayfa adresi (örnek /hizmetler/egitimler/ ve menüdeki bağlantıyla aynı olmalı)
        type: string
        required: true
      - name: body
        label: İçerik
        type: rich-text

  - name: menu
    label: Menü
    type: file
    path: _data/menu.yml
    fields:
      - name: ogeler
        label: Menü başlıkları
        type: object
        list: true
        fields:
          - name: baslik
            label: Başlık
            type: string
          - name: link
            label: Bağlantı (alt başlıkları varsa boş bırak)
            type: string
          - name: alt
            label: Alt başlıklar
            type: object
            list: true
            fields:
              - name: baslik
                label: Başlık
                type: string
              - name: link
                label: Bağlantı
                type: string

  - name: sayaclar
    label: Sayaçlar
    type: file
    path: _data/sayaclar.yml
    fields:
      - name: sayaclar
        label: Elle girilen sayaçlar
        type: object
        list: true
        fields:
          - name: etiket
            label: Etiket
            type: string
          - name: sayi
            label: Sayı
            type: number

  - name: genel
    label: Genel bilgiler
    type: file
    path: _data/genel.yml
    fields:
      - name: site_adi
        label: Site adı
        type: string
      - name: slogan
        label: Ana başlık
        type: string
      - name: tanitim
        label: Ana sayfa tanıtım metni
        type: text
      - name: adres
        label: Adres
        type: text
      - name: telefon
        label: Telefon
        type: string
      - name: eposta
        label: E-posta
        type: string
